name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
          - os: windows-latest
            name: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxcursor-dev libudev-dev libfreetype-dev libgl1-mesa-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: bash
        run: |
          mkdir pkg
          cp build/sort_visualization pkg/ 2>/dev/null || cp build/Release/sort_visualization.exe pkg/
          cp -r Code/font pkg/font
          cp README.md LICENSE pkg/
          cd pkg
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a ../sort_visualization-${{ matrix.name }}.zip .
          else
            zip -r ../sort_visualization-${{ matrix.name }}.zip .
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: sort_visualization-${{ matrix.name }}
          path: sort_visualization-${{ matrix.name }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
